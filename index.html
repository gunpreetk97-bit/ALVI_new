<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALVI — Welcome</title>

  <!--
    ALVI Entry Point
    ─────────────────────────────────────────────────────────────────────
    This page immediately redirects visitors to Timmy (the welcome screen).
    The full Dashboard application lives in dashboard.html (unchanged).
    Timmy's "Continue to Dashboard" and "Skip for now" both link to
    dashboard.html — no redirect loop is possible.

    To restore the old entry point, copy index.html.bak-before-redirect
    back to index.html, or revert to the git backup commit.
    ─────────────────────────────────────────────────────────────────────
  -->

  <!-- Instant meta-redirect (fallback for no-JS environments) -->
  <meta http-equiv="refresh" content="0; url=timmy.html">

  <style>
    /* Shown only if redirect is somehow delayed */
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #F8F6F3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #1C2420;
    }
    p { font-size: 15px; color: #6E7872; }
    a { color: #326C65; font-weight: 600; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <p>Loading ALVI&hellip; <a href="timmy.html">Click here if not redirected</a></p>

  <script>
    // Immediate JS redirect — fastest path
    window.location.replace('timmy.html');
  </script>

</body>
</html>
