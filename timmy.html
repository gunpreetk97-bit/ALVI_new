<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALVI — Welcome with Timmy</title>
  <meta name="description" content="Meet Timmy, ALVI's friendly cognitive wellness companion. Check in with how you are feeling today before exploring your dashboard.">
  
  <!-- Preconnect and Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Standalone Timmy Companion Stylesheet -->
  <link rel="stylesheet" href="css/timmy.css">
</head>
<body>

  <main class="timmy-container" role="main">
    
    <!-- BRAND PILL -->
    <div class="timmy-brand-tag" aria-label="ALVI Cognitive Wellness Companion">
      <span class="timmy-brand-dot" aria-hidden="true"></span>
      <span>ALVI COMPANION</span>
    </div>

    <!-- TIMMY INTERACTIVE CHARACTER -->
    <div id="timmy-stage" class="timmy-stage" aria-label="Illustration of Timmy, a friendly hand-drawn companion whose eyes follow the cursor">
      <svg class="timmy-svg" viewBox="0 0 200 220" role="img" aria-hidden="true">
        <defs>
          <!-- Left Eye Clip Path for Smooth Eyelid Blink -->
          <clipPath id="left-eye-clip">
            <ellipse cx="74" cy="128" rx="20" ry="30" />
          </clipPath>
          <!-- Right Eye Clip Path for Smooth Eyelid Blink -->
          <clipPath id="right-eye-clip">
            <ellipse cx="126" cy="128" rx="20" ry="30" />
          </clipPath>
        </defs>

        <!-- Body / Shoulders Minimal Line -->
        <path class="timmy-body-line" d="M 44,205 C 44,218 30,222 14,228 M 156,205 C 156,218 170,222 186,228" />

        <!-- Large Slightly Irregular Hand-Drawn Head -->
        <path d="M 100,28
                 C 142,26 178,56 176,108
                 C 174,158 152,204 100,204
                 C 48,204 26,158 24,108
                 C 22,56 58,26 100,28 Z"
              fill="#FAF8F5"
              stroke="#1F2421"
              stroke-width="2.8"
              stroke-linecap="round"
              stroke-linejoin="round" />

        <!-- Left Ear Accent -->
        <path d="M 24,102 C 16,104 16,118 25,120"
              fill="none"
              stroke="#1F2421"
              stroke-width="2.6"
              stroke-linecap="round" />

        <!-- Right Ear Accent -->
        <path d="M 176,102 C 184,104 184,118 175,120"
              fill="none"
              stroke="#1F2421"
              stroke-width="2.6"
              stroke-linecap="round" />

        <!-- Subtle Cheek Warmth (Medical Teal Tint) -->
        <ellipse cx="48" cy="148" rx="9" ry="6" fill="#326C65" opacity="0.12" />
        <ellipse cx="152" cy="148" rx="9" ry="6" fill="#326C65" opacity="0.12" />

        <!-- Left Eye (Oversized Oval) -->
        <g id="timmy-left-eye-group">
          <ellipse class="timmy-eye" cx="74" cy="128" rx="20" ry="30" />
          <!-- Left Pupil (Tracked via JS) -->
          <g id="timmy-pupil-left">
            <ellipse class="timmy-pupil" cx="74" cy="128" rx="7.5" ry="9.5" />
            <circle class="timmy-catchlight" cx="72" cy="125" r="2.2" />
          </g>
          <!-- Left Eyelid (Blink) -->
          <g clip-path="url(#left-eye-clip)">
            <rect class="timmy-eyelid" x="50" y="94" width="48" height="68" rx="4" />
          </g>
        </g>

        <!-- Right Eye (Oversized Oval) -->
        <g id="timmy-right-eye-group">
          <ellipse class="timmy-eye" cx="126" cy="128" rx="20" ry="30" />
          <!-- Right Pupil (Tracked via JS) -->
          <g id="timmy-pupil-right">
            <ellipse class="timmy-pupil" cx="126" cy="128" rx="7.5" ry="9.5" />
            <circle class="timmy-catchlight" cx="124" cy="125" r="2.2" />
          </g>
          <!-- Right Eyelid (Blink) -->
          <g clip-path="url(#right-eye-clip)">
            <rect class="timmy-eyelid" x="102" y="94" width="48" height="68" rx="4" />
          </g>
        </g>

        <!-- Hand-Drawn Mouth (Dynamic Shape) -->
        <path id="timmy-mouth" class="timmy-mouth" d="M 90,172 Q 100,180 110,172" />
      </svg>
    </div>

    <!-- GENTLE EMPATHIC RESPONSE BUBBLE -->
    <div class="timmy-bubble" aria-live="polite">
      <p id="timmy-response" class="timmy-response-text"></p>
    </div>

    <!-- MAIN QUESTION & SUBTITLE -->
    <h1 class="timmy-question">How are you feeling today?</h1>
    <p class="timmy-subtitle">I'm Timmy, your cognitive wellness companion. Choose a mood or feel free to skip.</p>

    <!-- ACCESSIBLE MOOD SELECTION BUTTONS -->
    <div class="timmy-mood-grid" role="group" aria-label="Select your current mood">
      <button type="button" class="timmy-mood-btn" data-mood="happy" aria-pressed="false">
        <span class="mood-indicator" aria-hidden="true"></span>
        <span>Happy</span>
      </button>

      <button type="button" class="timmy-mood-btn" data-mood="calm" aria-pressed="false">
        <span class="mood-indicator" aria-hidden="true"></span>
        <span>Calm</span>
      </button>

      <button type="button" class="timmy-mood-btn" data-mood="tired" aria-pressed="false">
        <span class="mood-indicator" aria-hidden="true"></span>
        <span>Tired</span>
      </button>

      <button type="button" class="timmy-mood-btn" data-mood="sad" aria-pressed="false">
        <span class="mood-indicator" aria-hidden="true"></span>
        <span>Sad</span>
      </button>

      <button type="button" class="timmy-mood-btn" data-mood="anxious" aria-pressed="false">
        <span class="mood-indicator" aria-hidden="true"></span>
        <span>Anxious</span>
      </button>

      <button type="button" class="timmy-mood-btn" data-mood="okay" aria-pressed="false">
        <span class="mood-indicator" aria-hidden="true"></span>
        <span>Okay</span>
      </button>
    </div>

    <!-- ACTION BUTTONS -->
    <div class="timmy-actions">
      <a id="timmy-continue-btn" href="dashboard.html" class="timmy-continue-btn" role="button" aria-label="Continue to ALVI Dashboard">
        <span>Continue to Dashboard</span>
        <span aria-hidden="true">→</span>
      </a>

      <a id="timmy-skip-btn" href="dashboard.html" class="timmy-skip-btn" aria-label="Skip mood check-in and enter dashboard">
        Skip for now
      </a>
    </div>

  </main>

  <!-- Interactive Timmy Companion Script -->
  <script src="js/timmy.js"></script>
</body>
</html>
